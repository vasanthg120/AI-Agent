# HaiVE on one domain, in front of the Docker containers (which listen on 127.0.0.1 only):
#
#   https://app.example.com/            → frontend container  (127.0.0.1:5173)
#   https://app.example.com/api/…       → backend container   (127.0.0.1:3000, "/api" taken off — the
#                                          backend's own routes have no /api prefix)
#   https://app.example.com/socket.io/  → backend websockets  (live chat, Call Copilot)
#
# The AI service (8000), MongoDB, Redis and Qdrant are never reachable from outside.
#
# Install: copy to /etc/nginx/sites-available/haive, replace app.example.com with your domain,
# link it into sites-enabled, then run certbot (docs/deployment/AWS-EC2.md, step 6) — certbot adds
# the HTTPS server block and the HTTP→HTTPS redirect to this file by itself.

# Websocket upgrade only when the browser asks for one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # Call recordings can be up to 300 MB; everything else is far smaller.
    client_max_body_size 300m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI answers, CRM syncs and report builds can take minutes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Large uploads go straight through instead of being held on disk by Nginx first.
        proxy_request_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
