server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite's hashed bundles never change under the same name: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The app shell is never cached, so a deploy is picked up on the next page load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # HaiVE Dialer (/dialer/): a separate installable app with its own page, so its
    # own routes (/dialer/recents…) get that page, never the main app's.
    location = /dialer {
        return 301 /dialer/;
    }

    location /dialer/ {
        try_files $uri /dialer/index.html;
    }

    # Its page, its service worker and its manifest are always checked afresh, so a
    # deploy reaches installed Dialers on their next open (the worker then offers
    # "Refresh"). The service worker must stay on the site's own address, unproxied.
    location = /dialer/index.html {
        add_header Cache-Control "no-cache";
    }

    location = /dialer/sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /dialer/manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
